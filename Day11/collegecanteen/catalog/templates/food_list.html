<!DOCTYPE html>
<html>
<head><title>Food Items</title></head>
<body>

    <h2>Food Items</h2>
    <a href="{% url 'food_create' %}"> Add Food Item</a>
    <ul>
    {% for item in items %}
        <li>
            <a href="{% url 'food_detail' item.pk %}">{{ item.name }}</a> — Rs {{ item.price }} |
            <a href="{% url 'food_update' item.pk %}">Edit</a> |
            <a href="{% url 'food_delete' item.pk %}">Delete</a>
        </li>
    {% empty %}
        <li>No food items available.</li>
    {% endfor %}
    </ul>
</body>
</html>
