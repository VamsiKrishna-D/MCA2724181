<!DOCTYPE html>
<html>
<head><title>{{ item.name }}</title></head>
<body>
    <h1>{{ item.name }}</h1>
    {% if item.image %}
        <img src="{{ item.image.url }}" alt="{{ item.name }}" style="max-width:200px;">
    {% endif %}
    <p>{{ item.description }}</p>
    <p>Price: Rs {{ item.price }}</p>

    <a href="{% url 'food_update' item.pk %}">Edit</a> |
    <a href="{% url 'food_delete' item.pk %}">Delete</a> |
    <a href="{% url 'food_list' %}">Back to list</a>
</body>
</html>
