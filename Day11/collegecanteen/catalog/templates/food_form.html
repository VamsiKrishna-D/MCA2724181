<!DOCTYPE html>
<html>
<head><title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Food Item</title></head>
<body>
    <h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Food Item</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'food_list' %}">Back to list</a>
</body>
</html>
