<!DOCTYPE html>
<html>
<head><title>Delete Food Item</title></head>
<body>
    <h2>Are you sure you want to delete "{{ item.name }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'food_detail' item.pk %}">Cancel</a>
    </form>
</body>
</html>
