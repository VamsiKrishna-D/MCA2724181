<html>
    <body>
        <h2>Java Script HTML document</h2>
        <p>Finding HTml Element using<b>ducument.forms</b>.</p>
        <form id="frm1" action="">
            First Name: <input type="text" name="fname" value="Vamsi"><br><br>
            Last Name: <input type="text" name="lname" value="Krishna"><br><br>
            <input type="submit" value="Submit">
        </form>
        <p>These are values of each element in the form:</p>
        <p id="demo"></p>
        <script>
            const x=document.forms["frm1"];
            let text="";
            for(let i=0;i<x.length;i++){
                text+=x.elements[i].value+"<br>"
            }
            document.getElementById("demo").innerHTML=text;
        </script>
        </body>
        </html>
