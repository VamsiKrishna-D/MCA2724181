{%   extends  "master.html"  %}
{% block title %}Book List{% endblock %}
{%  block content  %}
    <h1>Book List</h1>
   <table border="5" cellpadding="10">
<tr><th>ID</th><th>Title</th><th>Author</th><th>Published date</th><th>Action</th></tr>

        {% for book in books %}
 <tr>
<td>{{book.id}}</td>
<td>{{ book.title }} </td>
<td> {{ book.author }}</td>
<td> {{ book.publication_date }}</td>
<td><a href="{% url 'book_update' book.id %}">Edit || </a>
         <a href="{% url 'book_delete' book.id %}">Delete</a>

</td>
</tr>
        {% endfor %}
    </table>
 {% endblock %}
