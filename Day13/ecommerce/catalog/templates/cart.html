<h2>Your Cart</h2>
{% for product in products %}
    <div>
        <h3>{{ product.name }}</h3>
        <p>Rs{{ product.price }}</p>
    </div>
{% endfor %}

{% if products %}
    <a href="{% url 'place_order' %}">Place Order</a>
{% else %}
    <p>Your cart is empty.</p>
{% endif %}

<br><a href="/">Continue Shopping</a>
