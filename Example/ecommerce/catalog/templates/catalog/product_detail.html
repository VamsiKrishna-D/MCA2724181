<h1>{{ product.name }}</h1>
{% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}">
{% endif %}
<p>{{ product.description }}</p>
<p>Price: Rs{{ product.price }}</p>
<a href="{% url 'add_to_cart' product.pk %}">Add to Cart</a>
<br><a href="/">Back to Products</a>
