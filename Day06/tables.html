<html>
<head>
    <script type=text/javascript>
            function pt(){
                var num=parseInt(document.getElementById("txtNumber").value);
                var i=0;
                for(i=0;i<=10;i++)
            {
                document.write(num+" * "+i+" ="+num*i);
                document.write("<br/>");
            }
            }
            </script>
</head><body>
    <p>
        Enter a number:<input id="txtNumber"></p>
        <button onclick="pt()">Print Table</button>
        </body></html>
